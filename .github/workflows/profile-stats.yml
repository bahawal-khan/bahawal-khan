name: Profile Stats

# Refreshes the snake, streak and language cards every hour.
# You can also run it instantly: Actions tab -> Profile Stats -> Run workflow.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 1) Language / stats / productive-time cards -> profile-summary-card-output/
      #    To include PRIVATE repos, create a classic Personal Access Token (scopes: repo,
      #    read:user) and save it as a repo secret named PROFILE_TOKEN.
      - name: Summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5

      # The step above commits on its own, so sync before adding more files.
      - name: Sync with main
        run: git pull --rebase --autostash origin main || true

      # 2) Snake game on your contribution graph (green) -> profile-stats/snake.svg
      - name: Snake game
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-stats/snake.svg?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      # Give the snake a dark card background so it looks right in light mode too
      - name: Snake background
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re
          p = "profile-stats/snake.svg"
          s = open(p, encoding="utf-8").read()
          m = re.search(r'<svg[^>]*viewBox="([-\d.\s]+)"[^>]*>', s)
          if m and "snake-bg" not in s:
              x, y, w, h = [float(v) for v in m.group(1).split()]
              rect = f'<rect id="snake-bg" x="{x}" y="{y}" width="{w}" height="{h}" rx="12" fill="#0d1117"/>'
              open(p, "w", encoding="utf-8").write(s[:m.end()] + rect + s[m.end():])
          PY

      # 3) Green heatmap + streak card -> profile-stats/
      - name: Heatmap and streak
        run: python3 .github/scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats profile-summary-card-output
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile stats"
            git pull --rebase origin main
            git push
          fi
